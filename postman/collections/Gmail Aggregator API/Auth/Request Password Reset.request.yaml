$kind: http-request
url: "{{base_url}}/auth/password/request-reset"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{email}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Password reset requested', function () {
        pm.response.to.have.status(201);
        const json = pm.response.json();
        if (json.token) pm.environment.set('password_reset_token', json.token);
      });
    language: text/javascript
order: 6000
