$kind: http-request
description: Creates a user and stores jwt_token from the response.
url: "{{base_url}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}",
      "displayName": "{{display_name}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Register returns token', function () {
        pm.response.to.have.status(201);
        const json = pm.response.json();
        pm.expect(json.token).to.be.a('string');
        pm.environment.set('jwt_token', json.token);
      });
    language: text/javascript
order: 1000
