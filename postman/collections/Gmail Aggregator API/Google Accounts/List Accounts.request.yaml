$kind: http-request
url: "{{base_url}}/google-accounts"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('List accounts response is an array', function () {
        pm.response.to.have.status(200);
        const json = pm.response.json();
        pm.expect(json).to.be.an('array');
        if (json.length > 0) {
          pm.environment.set('account_id', json[0].id);
        }
      });
    language: text/javascript
order: 1000
